<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1040" viewBox="0 0 1380 1040" role="img" aria-labelledby="title desc">
<title id="title">Two-node infrastructure and security lab</title>
<desc id="desc">The Legion Y540 runs Proxmox with Immich, Cloudflare, and operations containers. The IdeaPad Y700 runs TrueNAS with one 4 TB ZFS data disk and exports media over NFS. PostgreSQL is on local compute storage. Two local Restic repositories support migration recovery; offsite backup is planned.</desc>
<defs>
<marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="#8ca3be"/></marker>
<marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9" fill="#61c8ed"/></marker>
</defs>
<rect width="1380" height="1040" fill="#0b1221"/>

